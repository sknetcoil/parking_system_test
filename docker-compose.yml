services:
  db:
    image: postgres:15
    container_name: parking_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    container_name: parking_php
    volumes:
      - ./backend:/var/www/html
      - vendor_data:/var/www/html/vendor
    env_file:
      - .env
    command: /bin/sh -c "php /var/www/html/scripts/migrate.php && php-fpm"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: parking_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  websocket:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    container_name: parking_websocket
    volumes:
      - ./backend:/var/www/html
      - vendor_data:/var/www/html/vendor
    env_file:
      - .env
    ports:
      - "8081:8081"
    command: /bin/sh -c "php /var/www/html/server/websocket.php"
    depends_on:
      db:
        condition: service_healthy

  cronworker:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    container_name: parking_cronworker
    volumes:
      - ./backend:/var/www/html
      - vendor_data:/var/www/html/vendor
    env_file:
      - .env
    command: /bin/sh -c "while true; do php /var/www/html/scripts/stale_checker.php; sleep 60; done"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  vendor_data:
